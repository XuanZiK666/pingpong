# VLASH π0.5 LoRA fine-tuning for x1 robot pingpong task
# Data: /home/woan/下载/20260226 (LeRobot v3.0, 151 episodes, 30Hz, 7-DOF arm)

policy:
  type: pi05
  pretrained_path: /mnt/data/pi05_base
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  state_cond: true
  empty_cameras: 2          # 补 left_wrist + right_wrist 占位

dataset:
  repo_id: local/x1_pingpong
  root: /mnt/workspace/data/20260226
  video_backend: torchcodec

# 任务文本已写入 tasks.parquet，不需要 single_task

output_dir: outputs/train/x1_pingpong_lora
job_name: x1_pingpong_lora

# 训练规模：43k 帧的小数据集，先 5k 步看 loss，再决定是否加到 20k
batch_size: 1
grad_accum_steps: 4         # 等效 batch=8
steps: 20000
num_workers: 4
seed: 1000

use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 5.0e-5
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 500
  peak_lr: 5.0e-5
  decay_lr: 2.5e-6
  num_decay_steps: 20000

save_checkpoint: true
save_freq: 2000             # 每 2k 步存一个，方便挑

log_freq: 100
wandb:
  enable: false             # 想用 wandb 改 true 并填 entity

# 异步推理训练（让模型对 [0,8] 步延迟都 robust）
max_delay_steps: 8
shared_observation: true

lora:
  enable: true
  backend: peft
  r: 16
  alpha: 16
  dropout: 0
  extra_trainable_modules:
    - action_in_proj
    - action_out_proj
    - time_mlp_in
    - time_mlp_out
    - state_proj
    - state_mlp_in
    - state_mlp_out
    - embeddings
    - input_layernorm
    - post_attention_layernorm
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - out_proj
    - fc1
    - fc2